spring.application.name=meetroomBooking

server.port=8088

spring.datasource.url=jdbc:h2:mem:meetroombooking;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.properties.hibernate.hbm2ddl.import_files=import-qa.sql

# Only development
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled = true
springdoc.swagger-ui.enabled = true
springdoc.swagger-ui.operationsSorter=method

# definir la ruta de swagger-ui
springdoc.api-docs.path=/api-docs

# seleccionar las clases, paquetes a escanear
springdoc.packages-to-scan=com.test.meetroomBooking.controller

