spring.application.name=meetroomBooking

server.port=8088

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5434/meetroombooking
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

spring.jpa.properties.hibernate.hbm2ddl.import_files=data.sql

springdoc.api-docs.enabled = true
springdoc.swagger-ui.enabled = true
springdoc.swagger-ui.operationsSorter=method

# definir la ruta de swagger-ui
springdoc.api-docs.path=/api-docs

# seleccionar las clases, paquetes a escanear
springdoc.packages-to-scan=com.test.meetroomBooking.controller

